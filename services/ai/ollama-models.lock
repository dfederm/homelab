# Expected Ollama model digests — the model equivalent of the `image: name:tag@sha256:...` pins
# in the compose files.
#
# Ollama cannot pin a model to a digest: `name@sha256:...` is rejected by its name parser, and
# registry.ollama.ai will not serve a manifest by digest either. But `ollama pull` re-fetches the
# manifest on every deploy and prints identical output whether or not anything changed, so an
# upstream tag re-point would otherwise land with no diff and no trace. Models therefore get
# digest-*checked* here instead of digest-pinned: services/ai/post-up.sh compares what each tag
# actually resolved to against this file and reports any difference.
#
# Format: <model tag>  sha256:<digest>   (`#` comments and blank lines ignored)
#
# The digest is the sha256 of the model's manifest, as reported by Ollama's /api/tags and served
# by registry.ollama.ai for that tag. Check one without touching a deployment:
#
#   curl -s -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
#     https://registry.ollama.ai/v2/library/qwen3/manifests/30b-instruct | sha256sum
#
# This is a catalog, not a per-machine manifest: it may list more models than any one machine
# pulls. Each machine selects from it via OLLAMA_PULL_MODELS in its env file. A model that is
# pulled but missing here is reported as unpinned, with the line to add.
#
# When a drift report is correct and intended (a deliberate model update), update the digest here
# in the same commit that changes the model — that commit is the record of what changed and when.

qwen3:30b-instruct  sha256:19e422b0231392335cfc49cfd172de7034bb1aeabb08aa307cce745c60b272fe
qwen3:30b-thinking  sha256:ad815644918f0eaab341c12b67837cc6dd4562342cdaf118f83d5d554cb37226
qwen2.5:7b          sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
nomic-embed-text    sha256:0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f

# `qwen3:30b` is the unqualified tag, currently pointing at the same manifest as
# `qwen3:30b-thinking` above — the two digests being identical is what tells you that. Prefer an
# explicit `-instruct` / `-thinking` tag: which variant the bare tag resolves to is upstream's
# choice and can change without the name changing.
qwen3:30b           sha256:ad815644918f0eaab341c12b67837cc6dd4562342cdaf118f83d5d554cb37226
