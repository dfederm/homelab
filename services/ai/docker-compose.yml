# The family AI stack, sharing the internal `ai` network: Ollama (local LLM serving), Open
# WebUI (chat frontend, reaches Ollama at http://ollama:11434), SearXNG (private web-search
# backend for Open WebUI and Athena MCP, reached at http://searxng:8080), and Athena MCP
# (family tools including protected public-web access, reached at http://athena-mcp:8080).
# None of Ollama, SearXNG, or Athena MCP has authentication, so none is ever placed behind the
# public reverse proxy — they are reachable only on the internal `ai` network and the LAN. Open
# WebUI has its own multi-user auth and is exposed publicly via Caddy (the site block lives in
# services/reverse-proxy/Caddyfile). Because it is internet-facing from first boot, claim the
# admin account promptly on a fresh deploy (the first account to register becomes admin).
services:
  ollama:
    container_name: ollama
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    restart: unless-stopped
    # GPU access, off unless the machine's env file turns it on. A host with
    # NVIDIA GPUs sets OLLAMA_RUNTIME=nvidia and OLLAMA_NVIDIA_VISIBLE_DEVICES=all,
    # and the NVIDIA container toolkit injects the driver and device nodes at
    # start. The defaults below are the stock runtime with no devices, so a
    # CPU-only host — or a GPU host whose driver isn't up yet — serves on the CPU.
    runtime: ${OLLAMA_RUNTIME:-runc}
    environment:
      - TZ=${TZ}
      # Empty means "no GPUs", which is what makes the default safe.
      - NVIDIA_VISIBLE_DEVICES=${OLLAMA_NVIDIA_VISIBLE_DEVICES:-}
      # Inference needs CUDA (compute) and nvidia-smi (utility); no graphics.
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      # Optional clamps, both normally left blank. Ollama already admits models by available memory
      # and evicts (LRU) to make room; blank lets it auto-size the resident-model cap to 3 per GPU,
      # and concurrent requests per model to 1. The model count is a SEPARATE, earlier gate than the
      # memory check, so setting it too low evicts models that would have fit — a chat + task +
      # embedding trio well inside VRAM still thrashes at 2.
      # ⚠️ Worth clamping the model count in one case: on a CPU-only host in a container, Ollama
      # sizes system RAM from the hypervisor rather than the container's limit, so its memory gate
      # over-admits. VRAM on a GPU host is read accurately and needs no clamp.
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
      # Server-side default context window. This is load-bearing, not a tuning knob: Open WebUI
      # talks to the OpenAI-compatible /v1 endpoint (see the open-webui service below), and the
      # OpenAI protocol has no per-request context field — a model's num_ctx set in the Open WebUI
      # UI is silently dropped. Without this, every request falls back to Ollama's 4096 default,
      # and a tool-enabled model overflows it on the system prompt + tool schemas alone
      # ("request exceeds the available context size"). Applies to every model Ollama loads, so it
      # costs KV-cache RAM per resident model; weigh against OLLAMA_MAX_LOADED_MODELS.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-32768}
    volumes:
      # Ollama data dir (models + cache). Point OLLAMA_MODELS_ROOT at a faster store
      # (e.g. NVMe) to speed model loads; falls back to the ZFS-backed appdata dir.
      - ${OLLAMA_MODELS_ROOT:-${DOCKER_APPDATA_ROOT}/ollama}:/root/.ollama
    ports:
      - '${OLLAMA_HTTP_PORT}:11434'
    networks:
      - ai
    healthcheck:
      test: ['CMD', 'ollama', 'ls']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Declaratively ensures the configured models are present. Runs once each deploy after
  # the server is healthy, then exits. `ollama pull` is idempotent (already-present models
  # are skipped) and runs server-side, so this is a thin API client — no volume needed.
  # A large pull (e.g. qwen3.6:35b-a3b) downloads in the background; follow it with
  # `docker logs -f ollama-pull`.
  ollama-pull:
    container_name: ollama-pull
    image: ollama/ollama:0.31.1@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS}
    networks:
      - ai
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        echo "Ensuring models present: $$OLLAMA_PULL_MODELS"
        for model in $$OLLAMA_PULL_MODELS; do
          echo "==> ollama pull $$model"
          ollama pull "$$model"
        done
        echo "All requested models are present."
    restart: 'no'

  # Multi-user chat / agent frontend in front of Ollama. Reaches the model server over the
  # internal `ai` network at http://ollama:11434. Open WebUI has its own auth (first account
  # created becomes the admin); it is reachable on the LAN via the published port and exposed
  # publicly via Caddy (site block in services/reverse-proxy/Caddyfile).
  # Its SQLite DB + ChromaDB (per-user chats, settings, RAG vectors) persist on ZFS-backed
  # appdata so they survive container recreation.
  # NOTE: many of these env vars (OLLAMA_BASE_URL, WEBUI_URL, ENABLE_OPENAI_API,
  # OPENAI_API_BASE_URL, OPENAI_API_KEY, ENABLE_SIGNUP, DEFAULT_USER_ROLE, TASK_MODEL*,
  # RAG_EMBEDDING_*) are "PersistentConfig" — read on first launch then stored in the DB. After the
  # first deploy they are managed in the UI/DB, so changing them here later has no effect unless the
  # data volume is wiped. They seed sane first-run defaults; on an existing instance the same change
  # must ALSO be made in Admin Settings, under the panel that owns the setting (Connections for the
  # connection vars, Interface for TASK_MODEL*, Documents for RAG_EMBEDDING_*).
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - OLLAMA_BASE_URL=http://ollama:11434
      # Public URL, used for share links / OAuth redirects / notifications.
      - WEBUI_URL=https://${OPEN_WEBUI_FQDN}
      # Chat traffic goes through Open WebUI's OpenAI-compatible client, pointed at the SAME local
      # Ollama's /v1 endpoint (Ollama serves an OpenAI-compatible API alongside its native one).
      # Reason: Open WebUI's Ollama-specific middleware mangles a turn that returns MULTIPLE tool
      # calls (it concatenates them into one malformed call), which makes athena-mcp error out and
      # the chat hang. Its OpenAI code path handles multi-tool turns correctly. Same server, same
      # model — just the working handler.
      # ⚠️ OPENAI_API_BASE_URL MUST stay pinned at the local Ollama. Enabling the OpenAI API without
      # it makes Open WebUI default to https://api.openai.com — i.e. family chats leaving the house.
      # This stack never talks to an external model provider; do not "clean up" this URL.
      # OPENAI_API_KEY is a placeholder: Ollama ignores it, but the client requires a non-empty value.
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://ollama:11434/v1
      - OPENAI_API_KEY=ollama
      # The native Ollama connection stays enabled: RAG_EMBEDDING_ENGINE=ollama below uses it for
      # embeddings (a separate code path, unaffected by the tool-call bug), and it keeps the model
      # list/pull management in the UI working. Chat is what moves to the OpenAI connection.
      # It also keeps the task model reachable under an unprefixed id (see TASK_MODEL below):
      # disabling this connection, or giving it a prefix, can silently change which model Open WebUI
      # picks for background tasks.
      # Family instance: no public self-registration — the admin provisions each account
      # (Admin Settings -> Users -> Add User). NOTE: the very first account to register still
      # becomes the admin (initial-admin signup intentionally bypasses this flag), so create
      # yours promptly on first launch before exposing it externally.
      - ENABLE_SIGNUP=false
      # Defense in depth: any account that does get created lands in 'pending' and cannot use
      # the app (no model access) until an admin approves it.
      - DEFAULT_USER_ROLE=pending
      # Use the small/fast model for background tasks (title/tag/query generation) so the large chat
      # model isn't burned on trivia.
      # BOTH vars are needed: Open WebUI picks the task model by the chat model's connection type —
      # TASK_MODEL for the native Ollama connection, TASK_MODEL_EXTERNAL for the OpenAI-compatible
      # one — and which applies depends on how the connections are configured in the UI. If neither
      # matches, background tasks fall back to the chat model itself, which is expensive well beyond
      # the wasted tokens: Ollama serves one KV cache slot per model (OLLAMA_NUM_PARALLEL), so a
      # background task on the chat model evicts the conversation's cached prompt prefix and the
      # user's next turn re-prefills the whole context — minutes on CPU inference.
      # ⚠️ The model must also be in OLLAMA_PULL_MODELS and readable by non-admin users (Admin
      # Settings -> Models): background tasks run under the requesting user and are access-checked,
      # but admins bypass that check, so a task model only an admin can read fails for everyone else
      # silently, with no error in the UI.
      - TASK_MODEL=${OPEN_WEBUI_TASK_MODEL}
      - TASK_MODEL_EXTERNAL=${OPEN_WEBUI_TASK_MODEL}
      # Use the local Ollama embeddings model for RAG instead of Open WebUI's bundled
      # default, so the pulled embeddings model (OPEN_WEBUI_RAG_EMBEDDING_MODEL) is actually used.
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${OPEN_WEBUI_RAG_EMBEDDING_MODEL}
      # Athena MCP provides web tools, so Open WebUI's native web search is disabled.
      # This is PersistentConfig: existing instances must also disable it in the UI.
      - ENABLE_WEB_SEARCH=false
      # --- Single sign-on via Authelia (OIDC), enforced SSO-only: Authelia is the sole login path.
      # OAUTH_AUTO_REDIRECT sends the login page straight to Authelia; ENABLE_LOGIN_FORM=false removes
      # the local username/password form. Existing accounts match their Authelia identity by email;
      # new OAuth logins land in DEFAULT_USER_ROLE=pending for admin approval (defense in depth). The
      # discovery URL reaches Authelia over the public FQDN (NAT hairpin, no extra_hosts). The
      # OPENID_REDIRECT_URI pins the callback explicitly (from ${OPEN_WEBUI_FQDN}) so it always matches
      # the client's redirect_uris in services/authelia/configuration.yml. The oauth.* vars (incl.
      # OAUTH_AUTO_REDIRECT) are re-read from env each startup (ENABLE_OAUTH_PERSISTENT_CONFIG=false).
      # ENABLE_LOGIN_FORM is the exception: PersistentConfig, read from env only at a fresh instance's
      # FIRST launch then frozen in the DB — set here so a from-scratch instance is SSO-only, but on an
      # already-initialized instance it must ALSO be toggled off in Admin Settings -> Auth. Break-glass
      # if Authelia is down: re-enable the form in Admin Settings (needs a live admin session) or in
      # Open WebUI's DB. See services/authelia/README.md.
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - OAUTH_PROVIDER_NAME=Authelia
      - OAUTH_AUTO_REDIRECT=true
      - ENABLE_LOGIN_FORM=false
      - OPENID_PROVIDER_URL=https://${AUTHELIA_FQDN}/.well-known/openid-configuration
      - OPENID_REDIRECT_URI=https://${OPEN_WEBUI_FQDN}/oauth/oidc/callback
      - OAUTH_CLIENT_ID=open-webui
      - OAUTH_CLIENT_SECRET=${OPEN_WEBUI_OIDC_CLIENT_SECRET}
      - OAUTH_SCOPES=openid email profile
      # Forward the signed-in user's identity to MCP/OpenAPI tools so a tool can act as that user
      # (e.g. athena-mcp's per-user Vikunja tasks). Open WebUI mints a short-lived HS256 JWT in the
      # `X-OpenWebUI-User-Jwt` header; athena-mcp verifies it with the SAME secret and maps the email
      # to that user's backend token. Secret must match on both sides and be >=32 chars.
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - FORWARD_USER_INFO_HEADER_JWT_SECRET=${OPEN_WEBUI_FORWARD_USER_JWT_SECRET}
      # OWUI mints this JWT once per chat turn (when it connects to the MCP server) and reuses it for
      # every tool call in that turn without refreshing it mid-turn. The default TTL is 300s (5 min),
      # so a turn that runs longer than that — easy with a large model on CPU — makes its later tool
      # calls fail auth ("forwarded identity token failed validation"), leaving the request spinning.
      # Raise the TTL to comfortably outlive any single turn (1 hour is plenty — the token only needs
      # to span one turn, since OWUI tears the MCP connection down when the turn ends). Internal,
      # ai-network-only identity token (never exposed publicly), so the exact value is not security-critical.
      - FORWARD_USER_INFO_HEADER_JWT_EXPIRES_SECONDS=3600
    volumes:
      - ${DOCKER_APPDATA_ROOT}/open-webui:/app/backend/data
    ports:
      - '${OPEN_WEBUI_HTTP_PORT}:8080'
    networks:
      - ai
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous on first boot: cold start runs DB migrations + first-run RAG setup.
      start_period: 60s

  # Self-hosted SearXNG metasearch — the private web-search backend Open WebUI queries (see the
  # web-search env on open-webui above), and the backend for Athena MCP's web_search tool. It has
  # no auth, so like Ollama it is never placed behind the public reverse proxy. It is an
  # internal-only backend: no host port is published — consumers reach it over the `ai` network at
  # http://searxng:8080.
  searxng:
    container_name: searxng
    image: searxng/searxng:2026.6.26-f8ffbf36f@sha256:15275f138662b0eefd62c492a919b29c4662c42004efe4b1a245c92cc6d2fef1
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Instance secret. SearXNG natively lets this env var override server.secret_key, so the
      # secret stays out of this public repo.
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    volumes:
      # Config is declarative: the committed settings.yml is mounted read-only (the secret is
      # injected via SEARXNG_SECRET above, not stored here). Mounting a repo config file
      # read-only mirrors services/reverse-proxy (Caddyfile) and services/webhook (hooks.json).
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      # Runtime cache (favicons, etc.) on ZFS-backed appdata so it survives container recreation.
      - ${DOCKER_APPDATA_ROOT}/searxng:/var/cache/searxng
    networks:
      - ai
    healthcheck:
      # The image has no guaranteed curl/wget, but its bundled Python venv is always present.
      test:
        - CMD
        - /usr/local/searxng/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Athena MCP — family tools over Streamable HTTP, including homelab health, shopping lists,
  # calendars, contacts, media, photos, tasks, weather, and protected public-web search/fetch.
  # Open WebUI's native MCP client consumes it at http://athena-mcp:8080. Like Ollama and SearXNG it
  # has no auth, so it is never placed behind the public reverse proxy and publishes no host port —
  # the `ai` network + LAN is the trust boundary.
  # The image is our own, built + published by the athena-mcp repo's Forgejo CI (`dotnet publish
  # -t:PublishContainer`, no Dockerfile) to our Forgejo OCI registry. It is PRIVATE, so this stack's
  # pre-up hook logs the host in (`docker login`) before the pull (see the "Athena MCP" section in the README).
  # `${CONTAINER_REGISTRY}` keeps the registry host out of this public repo; the image name + digest
  # stay in-repo (immutable, non-sensitive), pinning tag AND digest like the `forgejo`/`ollama` idiom.
  athena-mcp:
    container_name: athena-mcp
    # Pinned by tag AND digest (like forgejo/ollama). Renovate can't reach this private registry, so
    # bump both by hand: get the newest tag from the athena-mcp CI publish job summary and the digest
    # from that build's registry manifest.
    image: ${CONTAINER_REGISTRY}/david/athena-mcp:0.1.30@sha256:199312ee2ca9054669e4a49498f9c93bcc6eaf2cb292af790e55c6b997be38c9
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Beszel hub (PocketBase REST) — published on the Docker host. Auth is a read-only service
      # account (email Identity + Password); AuthCollection defaults to `users` unless a _superusers
      # token is needed to read every host's records. Share each new host with this account in Beszel
      # or it is missing from list_systems (see the root README).
      - Homelab__Beszel__BaseUrl=http://${DOCKER_HOST_IP}:${BESZEL_WEB_PORT}
      - Homelab__Beszel__Identity=${ATHENA_MCP_BESZEL_IDENTITY}
      - Homelab__Beszel__Password=${ATHENA_MCP_BESZEL_PASSWORD}
      - Homelab__Beszel__AuthCollection=${ATHENA_MCP_BESZEL_AUTH_COLLECTION:-users}
      # Scrutiny web API — published on the Docker host, no auth (internal-only).
      - Homelab__Scrutiny__BaseUrl=http://${DOCKER_HOST_IP}:${SCRUTINY_WEB_PORT}
      # Proxmox VE API — self-signed cert (AllowInsecureTls trusts it for this client only). Auth is
      # a read-only PVEAuditor API token; the user AND the token both need the role (privsep — see
      # the root README).
      - Homelab__Proxmox__BaseUrl=https://${PROXMOX_IP}:${PROXMOX_WEB_PORT}
      - Homelab__Proxmox__Node=${ATHENA_MCP_PROXMOX_NODE}
      - Homelab__Proxmox__ApiTokenId=${ATHENA_MCP_PROXMOX_TOKEN_ID}
      - Homelab__Proxmox__ApiTokenSecret=${ATHENA_MCP_PROXMOX_TOKEN_SECRET}
      - Homelab__Proxmox__AllowInsecureTls=true
      # Koffan shopping-list REST API — the koffan service is its own compose project on a separate
      # network, so reach it via the host's published port (like Beszel/Scrutiny), not a service name.
      # ApiToken is Koffan's REST token (reused from the koffan service's own KOFFAN_API_TOKEN).
      - Apps__Koffan__BaseUrl=http://${DOCKER_HOST_IP}:${KOFFAN_HTTP_PORT}
      - Apps__Koffan__ApiToken=${KOFFAN_API_TOKEN}
      # Per-user Vikunja task tools (add_task/list_tasks/complete_task), gated by the forwarded
      # identity above: the JWT is verified with the SAME secret, then the email maps to that user's
      # Vikunja token. Anonymous-by-default + fail-closed, so read-only/Koffan tools are unaffected.
      # Like Koffan, Vikunja is its own compose project, so reach it via the host's published port.
      # Users are an indexed list (`@`/`.` are invalid in env-var names) — up to 5 family slots (0-4) are
      # pre-wired below. An unset/empty slot binds to an inert, fail-closed entry (no per-user cred, so
      # it never matches a caller), so a member activates by setting their apollo.env creds and
      # re-running the ai service to re-source env — no compose edit (or repo push) needed.
      - Identity__ForwardedUserJwtSecret=${OPEN_WEBUI_FORWARD_USER_JWT_SECRET}
      - Apps__Vikunja__BaseUrl=http://${DOCKER_HOST_IP}:${VIKUNJA_HTTP_PORT}
      - Apps__Vikunja__Users__0__Email=${ATHENA_MCP_VIKUNJA_USER_0_EMAIL}
      - Apps__Vikunja__Users__0__ApiToken=${ATHENA_MCP_VIKUNJA_USER_0_TOKEN}
      - Apps__Vikunja__Users__1__Email=${ATHENA_MCP_VIKUNJA_USER_1_EMAIL}
      - Apps__Vikunja__Users__1__ApiToken=${ATHENA_MCP_VIKUNJA_USER_1_TOKEN}
      - Apps__Vikunja__Users__2__Email=${ATHENA_MCP_VIKUNJA_USER_2_EMAIL}
      - Apps__Vikunja__Users__2__ApiToken=${ATHENA_MCP_VIKUNJA_USER_2_TOKEN}
      - Apps__Vikunja__Users__3__Email=${ATHENA_MCP_VIKUNJA_USER_3_EMAIL}
      - Apps__Vikunja__Users__3__ApiToken=${ATHENA_MCP_VIKUNJA_USER_3_TOKEN}
      - Apps__Vikunja__Users__4__Email=${ATHENA_MCP_VIKUNJA_USER_4_EMAIL}
      - Apps__Vikunja__Users__4__ApiToken=${ATHENA_MCP_VIKUNJA_USER_4_TOKEN}
      # Per-user calendar tools (list_events/add_event/delete_event), gated by the same forwarded
      # identity: the JWT is verified, then the caller's email selects their Radicale HTTP Basic
      # credentials. Radicale is its own compose project, so reach it via the host's published port
      # (same-origin, not the public FQDN). BaseUrl is the DAV root (used to discover a user's personal
      # calendar); FamilyCalendarUrl is the shared calendar's absolute URL. Users are an indexed list
      # keyed by email — up to 5 family slots (0-4) are pre-wired below. An unset/empty slot binds to an
      # inert, fail-closed entry, so a member activates by setting their apollo.env creds and re-running
      # the ai service to re-source env — no compose edit (or repo push) needed.
      - Apps__Radicale__BaseUrl=http://${DOCKER_HOST_IP}:${RADICALE_HTTP_PORT}
      - Apps__Radicale__FamilyCalendarUrl=http://${DOCKER_HOST_IP}:${RADICALE_HTTP_PORT}/${ATHENA_MCP_RADICALE_FAMILY_CALENDAR_URL}
      - Apps__Radicale__FamilyContactsUrl=http://${DOCKER_HOST_IP}:${RADICALE_HTTP_PORT}/${ATHENA_MCP_RADICALE_FAMILY_CONTACTS_URL}
      - Apps__Radicale__Users__0__Email=${ATHENA_MCP_RADICALE_USER_0_EMAIL}
      - Apps__Radicale__Users__0__Username=${ATHENA_MCP_RADICALE_USER_0_USERNAME}
      - Apps__Radicale__Users__0__Password=${ATHENA_MCP_RADICALE_USER_0_PASSWORD}
      - Apps__Radicale__Users__1__Email=${ATHENA_MCP_RADICALE_USER_1_EMAIL}
      - Apps__Radicale__Users__1__Username=${ATHENA_MCP_RADICALE_USER_1_USERNAME}
      - Apps__Radicale__Users__1__Password=${ATHENA_MCP_RADICALE_USER_1_PASSWORD}
      - Apps__Radicale__Users__2__Email=${ATHENA_MCP_RADICALE_USER_2_EMAIL}
      - Apps__Radicale__Users__2__Username=${ATHENA_MCP_RADICALE_USER_2_USERNAME}
      - Apps__Radicale__Users__2__Password=${ATHENA_MCP_RADICALE_USER_2_PASSWORD}
      - Apps__Radicale__Users__3__Email=${ATHENA_MCP_RADICALE_USER_3_EMAIL}
      - Apps__Radicale__Users__3__Username=${ATHENA_MCP_RADICALE_USER_3_USERNAME}
      - Apps__Radicale__Users__3__Password=${ATHENA_MCP_RADICALE_USER_3_PASSWORD}
      - Apps__Radicale__Users__4__Email=${ATHENA_MCP_RADICALE_USER_4_EMAIL}
      - Apps__Radicale__Users__4__Username=${ATHENA_MCP_RADICALE_USER_4_USERNAME}
      - Apps__Radicale__Users__4__Password=${ATHENA_MCP_RADICALE_USER_4_PASSWORD}
      # Read-only weather tools (get_current_weather/get_weather_forecast) over US NWS + OSM Nominatim
      # (keyless, US-only). DefaultLocation is used when a caller omits a location; the base URLs have
      # sensible in-app defaults, so no other weather config is required.
      - Apps__Weather__DefaultLocation=${ATHENA_MCP_WEATHER_DEFAULT_LOCATION}
      # Public-web tools. Search stays on the internal SearXNG service and returns at most five
      # bounded snippets; direct fetch independently enforces Athena's public-address and response
      # bounds. The language matches the established SearXNG search policy.
      - Apps__Searxng__BaseUrl=http://searxng:8080/
      - Apps__Searxng__Language=en
      # Per-user media tools (search_media/list_new_media/list_resume_media/recommend_media) over the
      # family Jellyfin, gated by the same forwarded identity: the JWT is verified, then the caller's
      # email selects their Jellyfin ACCESS TOKEN — a per-user login-minted token, NOT a Dashboard
      # "API Key" (those are server-wide admin tokens that bypass parental controls). Acting as the
      # user is what makes "continue watching" and the kid-safe per-account library + parental-rating
      # views correct. Jellyfin is its own compose project, so BaseUrl reaches it via the host's
      # published port; PublicBaseUrl is the browser-facing FQDN used only to build the clickable deep
      # links returned by the media tools (null/omitted → no link).
      # Users are an indexed list keyed by email — up to 5 family slots (0-4) are pre-wired below. An
      # unset/empty slot binds to an inert, fail-closed entry, so a member activates by setting their
      # apollo.env creds and re-running the ai service — no compose edit (or repo push) needed.
      - Apps__Jellyfin__BaseUrl=http://${DOCKER_HOST_IP}:${JELLYFIN_HTTP_PORT}
      - Apps__Jellyfin__PublicBaseUrl=https://${JELLYFIN_FQDN}
      - Apps__Jellyfin__Users__0__Email=${ATHENA_MCP_JELLYFIN_USER_0_EMAIL}
      - Apps__Jellyfin__Users__0__AccessToken=${ATHENA_MCP_JELLYFIN_USER_0_TOKEN}
      - Apps__Jellyfin__Users__1__Email=${ATHENA_MCP_JELLYFIN_USER_1_EMAIL}
      - Apps__Jellyfin__Users__1__AccessToken=${ATHENA_MCP_JELLYFIN_USER_1_TOKEN}
      - Apps__Jellyfin__Users__2__Email=${ATHENA_MCP_JELLYFIN_USER_2_EMAIL}
      - Apps__Jellyfin__Users__2__AccessToken=${ATHENA_MCP_JELLYFIN_USER_2_TOKEN}
      - Apps__Jellyfin__Users__3__Email=${ATHENA_MCP_JELLYFIN_USER_3_EMAIL}
      - Apps__Jellyfin__Users__3__AccessToken=${ATHENA_MCP_JELLYFIN_USER_3_TOKEN}
      - Apps__Jellyfin__Users__4__Email=${ATHENA_MCP_JELLYFIN_USER_4_EMAIL}
      - Apps__Jellyfin__Users__4__AccessToken=${ATHENA_MCP_JELLYFIN_USER_4_TOKEN}
      # Per-user photo-search tools (search_photos/count_photos/find_people) over the family Immich,
      # gated by the same forwarded identity: the JWT is verified, then the caller's email selects
      # their Immich API KEY (stamped as x-api-key) — a per-user least-privilege key (asset.read,
      # asset.statistics, person.read). Metadata only — ids/dates/people/counts + a deep link, never
      # image bytes. Immich is its own compose project, so BaseUrl reaches it via the host's published
      # port; PublicBaseUrl is the browser-facing FQDN used only to build the clickable deep links.
      # Users are an indexed list keyed by email — up to 5 family slots (0-4) are pre-wired below. An
      # unset/empty slot binds to an inert, fail-closed entry, so a member activates by setting their
      # apollo.env creds and re-running the ai service — no compose edit (or repo push) needed.
      - Apps__Immich__BaseUrl=http://${DOCKER_HOST_IP}:${PHOTOS_HTTP_PORT}
      - Apps__Immich__PublicBaseUrl=https://${PHOTOS_FQDN}
      - Apps__Immich__Users__0__Email=${ATHENA_MCP_IMMICH_USER_0_EMAIL}
      - Apps__Immich__Users__0__ApiKey=${ATHENA_MCP_IMMICH_USER_0_APIKEY}
      - Apps__Immich__Users__1__Email=${ATHENA_MCP_IMMICH_USER_1_EMAIL}
      - Apps__Immich__Users__1__ApiKey=${ATHENA_MCP_IMMICH_USER_1_APIKEY}
      - Apps__Immich__Users__2__Email=${ATHENA_MCP_IMMICH_USER_2_EMAIL}
      - Apps__Immich__Users__2__ApiKey=${ATHENA_MCP_IMMICH_USER_2_APIKEY}
      - Apps__Immich__Users__3__Email=${ATHENA_MCP_IMMICH_USER_3_EMAIL}
      - Apps__Immich__Users__3__ApiKey=${ATHENA_MCP_IMMICH_USER_3_APIKEY}
      - Apps__Immich__Users__4__Email=${ATHENA_MCP_IMMICH_USER_4_EMAIL}
      - Apps__Immich__Users__4__ApiKey=${ATHENA_MCP_IMMICH_USER_4_APIKEY}
    networks:
      - ai
    healthcheck:
      # The ASP.NET runtime image has no curl/wget/bash, so the server probes its own /health
      # endpoint via its own binary (exit 0 = healthy). See the root README. The timeout is generous
      # because each probe spins up a fresh `dotnet` process.
      test: ['CMD', 'dotnet', '/app/AthenaMcp.Server.dll', '--health-check']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # HA MCP bridge — exposes Home Assistant's Assist tools to Open WebUI. HA's MCP Server integration
  # serves SSE, and OWUI's native MCP client only speaks Streamable HTTP at a protocol version HA
  # rejects, so a native-MCP bridge can't handshake. Instead we use mcpo (the Open WebUI project's
  # MCP->OpenAPI proxy): it connects to HA's SSE endpoint with the Athena service-account token and
  # re-exposes the tools as an OpenAPI tool server on the `ai` network. Register it in OWUI as an
  # OpenAPI tool server at http://ha-mcp-bridge:8000. No auth / no host port; scope = HA's
  # exposed-to-Assist set. See the README HA-MCP-bridge section.
  ha-mcp-bridge:
    container_name: ha-mcp-bridge
    image: ghcr.io/open-webui/mcpo:main@sha256:1e82c9555c19e50b80745705f32b47a2647589f35279527b5118ecd3a71bd467
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    command:
      - --port
      - "8000"
      - --server-type
      - sse
      - --header
      - '{"Authorization":"Bearer ${HA_MCP_TOKEN}"}'
      - --name
      - home-assistant
      - --
      - http://${HOMEASSISTANT_IP}:8123/mcp_server/sse
    networks:
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai:
    name: ai
    driver: bridge
