services:
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:0.19.0@sha256:00c88600e7d120128f623b2deb5257603d464e841fd68f88cc791dcc075f9e46
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - LISTEN=${BESZEL_AGENT_PORT}
      # KEY is the hub's public SSH key (shared by all agents).
      # When adding a system in the hub UI, set Host/IP to <machine-ip>:<port>.
      - KEY=${BESZEL_AGENT_KEY}

volumes:
  beszel-agent-data:
