services:
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:0.20.0@sha256:765e3d4a087c4bcbf6b78ed0f1dfdcd669c4bf6ad5789a832d2944603ae7fd08
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - LISTEN=${BESZEL_AGENT_PORT}
      # KEY is the hub's public SSH key (shared by all agents).
      # When adding a system in the hub UI, set Host/IP to <machine-ip>:<port>.
      - KEY=${BESZEL_AGENT_KEY}

volumes:
  beszel-agent-data:
