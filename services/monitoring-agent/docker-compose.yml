services:
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:0.21.0@sha256:f27b1aa2c68404bc5b9e1a2ab36653bd9b4ee14f6299862f09cd5051a4134767
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - LISTEN=${BESZEL_AGENT_PORT}
      # KEY is the hub's public SSH key (shared by all agents).
      # When adding a system in the hub UI, set Host/IP to <machine-ip>:<port>.
      - KEY=${BESZEL_AGENT_KEY}

volumes:
  beszel-agent-data:
