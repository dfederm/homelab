services:
  beszel-agent:
    container_name: beszel-agent
    image: henrygd/beszel-agent:0.21.2@sha256:343254226ae57a5cc6f8c23c755b1464730aba2abc7043116a2e222711ec6e1a
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - LISTEN=${BESZEL_AGENT_PORT}
      # KEY is the hub's public SSH key (shared by all agents).
      # When adding a system in the hub UI, set Host/IP to <machine-ip>:<port>.
      - KEY=${BESZEL_AGENT_KEY}

volumes:
  beszel-agent-data:
