services:
  bedrock-connect:
    container_name: bedrock-connect
    image: pugmatt/bedrock-connect:1.72.1@sha256:5a5d550c5558c0878672eb3962b82cd2450ddf01b61cfb1c47d323d410929907
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - BC_NET_MODE=both
      - BC_WEBRTC_PORT=${BEDROCK_CONNECT_WEBRTC_PORT:?BEDROCK_CONNECT_WEBRTC_PORT required}
      - BC_ADVERTISE_ADDRESSES=${DOCKER_HOST_IP:?DOCKER_HOST_IP required}
      - BC_STUN_DISCOVERY=false
      # Show every console the predefined world menu, and lock it down: players
      # can't add/remove servers, and no third-party "featured" servers are listed.
      - BC_CUSTOM_SERVERS=/config/custom_servers.json
      - BC_USER_SERVERS=false
      - BC_FEATURED_SERVERS=false
    # DNS-redirected consoles need 19132 for discovery/signaling. In both mode,
    # NetherNet media needs its own UDP port to avoid the legacy RakNet listener.
    ports:
      - '19132:19132/udp'
      - '19132:19132/tcp'
      - '${BEDROCK_CONNECT_WEBRTC_PORT:?BEDROCK_CONNECT_WEBRTC_PORT required}:${BEDROCK_CONNECT_WEBRTC_PORT:?BEDROCK_CONNECT_WEBRTC_PORT required}/udp'
    # custom_servers.json (the world menu) lives in this NAS directory, mounted
    # read-only. Mounting the directory (not the file) avoids Docker creating a
    # phantom directory if the file doesn't exist yet.
    volumes:
      - ${BEDROCK_CONNECT_CONFIG}:/config:ro
      # Clients pin the server identity, so it must survive container recreation.
      - ${DOCKER_APPDATA_ROOT}/bedrock-connect/nethernet:/docker/brc/nethernet
