services:
  # Time-series store for Scrutiny's SMART history. Internal only (no published
  # port) — only scrutiny-web talks to it, over the compose network. Scrutiny-web
  # auto-provisions the InfluxDB org/bucket/token on first start.
  scrutiny-influxdb:
    container_name: scrutiny-influxdb
    image: influxdb:2.9@sha256:270145207873eb426e15a211063532fc6f966f4ffb6edf4114ffac83ac4696eb
    restart: unless-stopped
    volumes:
      - ${DOCKER_APPDATA_ROOT}/scrutiny/influxdb:/var/lib/influxdb2
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Scrutiny web UI + API. The SMART collector runs on the Proxmox host (where the
  # physical disks live) and POSTs here — see scripts/setup/modules/configure-scrutiny-collector.sh.
  scrutiny-web:
    container_name: scrutiny-web
    image: ghcr.io/analogj/scrutiny:v0.9.3-web@sha256:a8c488a625bb79701338403b84a6d025f0884a35d348e412335bbd090f06ff3f
    restart: unless-stopped
    ports:
      - "${SCRUTINY_WEB_PORT}:8080"
    volumes:
      - ${DOCKER_APPDATA_ROOT}/scrutiny/config:/opt/scrutiny/config
    environment:
      - TZ=${TZ}
      - SCRUTINY_WEB_INFLUXDB_HOST=scrutiny-influxdb
      - SCRUTINY_WEB_INFLUXDB_PORT=8086
      # Drive-health alerts reuse the homelab's single shared Shoutrrr channel
      # (same URL the Beszel hub and the storage-space check use). Config-driven:
      # set HOMELAB_ALERT_SHOUTRRR_URL in common.env; blank = no notifications.
      - SCRUTINY_NOTIFY_URLS=${HOMELAB_ALERT_SHOUTRRR_URL:-}
    depends_on:
      scrutiny-influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
