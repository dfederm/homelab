services:
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:v11.3.5@sha256:dd09e6aaa9d5ad686b6017427a502c40dc862ba28445609813e5ea1f66f6dbdf
    restart: unless-stopped
    ports:
      - "${DOZZLE_WEB_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_APPDATA_ROOT}/dozzle:/data
    environment:
      - TZ=${TZ}
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
