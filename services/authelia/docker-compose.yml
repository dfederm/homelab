# See README.md for OIDC/forward-auth setup. Scalar secrets are env vars;
# users, issuer key, and client digest stay on the NAS. Sessions are in memory,
# while 2FA enrollment survives restarts on ZFS-backed appdata.
services:
  authelia:
    container_name: authelia
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    # Keep SSO available after host reboots.
    restart: always
    environment:
      - TZ=${TZ}
      # Template filter injects personal domains and issuer key at runtime.
      - X_AUTHELIA_CONFIG_FILTERS=template
      # Unprefixed values are template inputs, not Authelia config overrides.
      - HOMELAB_ROOT_DOMAIN=${AUTHELIA_ROOT_DOMAIN}
      - HOMELAB_AUTHELIA_URL=https://${AUTHELIA_FQDN}
      - OPEN_WEBUI_REDIRECT_URI=https://${OPEN_WEBUI_FQDN}/oauth/oidc/callback
      # Secrets must not also appear in configuration.yml: Authelia rejects duplicates.
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET=${AUTHELIA_OIDC_HMAC_SECRET}
    volumes:
      - ./configuration.yml:/config/configuration.yml:ro
      # Create all secret files before deploying; Docker turns missing bind
      # sources into directories. See services/authelia/README.md.
      - ${CONFIG_DIR}/authelia:/secrets:ro
      - ${DOCKER_APPDATA_ROOT}/authelia:/data
    ports:
      - '${AUTHELIA_HTTP_PORT}:9091'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
