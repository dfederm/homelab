services:
  beszel:
    container_name: beszel
    image: henrygd/beszel:0.21.0@sha256:6b39a8b64f9b15d00a25e7683e31a93c46161182a54f62713525107064e10599
    restart: unless-stopped
    ports:
      - "${BESZEL_WEB_PORT}:8090"
    volumes:
      - ${DOCKER_APPDATA_ROOT}/beszel:/beszel_data
    environment:
      - TZ=${TZ}

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2.5.6@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_WEB_PORT}:3001"
    volumes:
      - ${DOCKER_APPDATA_ROOT}/uptime-kuma:/app/data
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
